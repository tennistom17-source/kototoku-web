name: Update official AI model data

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official sources and update safe fields
        run: python scripts/update_models.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/models.json; then
            echo "No verified data changes."
            exit 0
          fi
          git config user.name "kototoku-model-updater[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models.json data/update-log.json
          git commit -m "Update verified AI model data"
          git push
